<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro do servidor — Diomika</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f0f0f0 0%, #ffffff 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .code {
      font-size: 6rem;
      font-weight: bold;
      color: #d97757;
      line-height: 1;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #333;
    }
    p {
      font-size: 1rem;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #d97757;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover {
      background: #c46545;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">500</div>
    <h1>Erro do servidor</h1>
    <p>Houve um problema no servidor. Estamos a trabalhar para resolver. Tente novamente em instantes.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
